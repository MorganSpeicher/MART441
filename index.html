<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>First Phaser Game</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
    <style type="text/css">
        body {
            margin: 0;
        }
    </style>
</head>
<body>

<script type="text/javascript">

    //Changes for assignment include changing the jump key from up-arrow to the spacebar;
    //Making the stars heavier/fall faster;
    //Added another platform and changed the scale on one;
    //Added a speedrun timer and stop it when player hits a bomb, that way the levels can progress with more stars and bombs.
    //I changed the sprite using Adobe Illustrator to look like a cat!

var config = {
    type: Phaser.AUTO,
    width: 800,
    height: 600,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 300 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

//Global Variables
var player;
var stars;
var bombs;
var platforms;
var cursors;
var score = 0;
var gameOver = false;
var scoreText;
var spaceBar;

//Time Variables
var timerText;
var startTime;
var elapsedTime = 0;
var finished = false;

var game = new Phaser.Game(config);

function preload ()
{
    this.load.image('sky', 'HW14/assets/sky.png');
    this.load.image('ground', 'HW14/assets/platform.png');
    this.load.image('star', 'HW14/assets/star.png');
    this.load.image('bomb', 'HW14/assets/bomb.png');
    this.load.spritesheet('dude', 'HW14/assets/dudeChanged.png',
        { frameWidth: 32, frameHeight: 48 });
}

function create ()
{
    //  A simple background for our game
    this.add.image(400, 300, 'sky');

    //  The platforms group contains the ground and the 2 ledges we can jump on
    platforms = this.physics.add.staticGroup();

    //  Here we create the ground.
    //  Scale it to fit the width of the game (the original sprite is 400x32 in size)
    platforms.create(400, 568, 'ground').setScale(2).refreshBody();

    //  Now let's create some ledges
    platforms.create(600, 450, 'ground');
    platforms.create(50, 250, 'ground');
    platforms.create(400, 320, 'ground').setScale(0.5).refreshBody();
    platforms.create(700, 100, 'ground');

    // The player and its settings
    player = this.physics.add.sprite(100, 450, 'dude');

    //  Player physics properties. Give the little guy a slight bounce.
    player.setBounce(0.2);
    player.setCollideWorldBounds(true);

    //  Our player animations, turning, walking left and walking right and jumping up with spacebar.
    
    this.anims.create({
        key: 'left',
        frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
        frameRate: 10,
        repeat: -1
    });

    this.anims.create({
        key: 'turn',
        frames: [ { key: 'dude', frame: 4 } ],
        frameRate: 20
    });

    this.anims.create({
        key: 'right',
        frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
        frameRate: 10,
        repeat: -1
    });

    //  Input Events
    cursors = this.input.keyboard.createCursorKeys();

    //Changes the jump to the spacebar
    spaceBar = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    //  Some stars to collect, 12 in total, evenly spaced 70 pixels apart along the x axis
    stars = this.physics.add.group({
        key: 'star',
        repeat: 11,
        setXY: { x: 12, y: 0, stepX: 70 }
    });

    stars.children.iterate(function (child) {

        //  Give each star a slightly different bounce
        child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));

        //Change the Gravity of the Stars
        child.body.setGravityY(600);

    });

    bombs = this.physics.add.group();

    //  The score
    scoreText = this.add.text(16, 16, 'score: 0', { fontSize: '32px', fill: '#000' });

    //  Collide the player and the stars with the platforms
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(stars, platforms);
    this.physics.add.collider(bombs, platforms);

    //  Checks to see if the player overlaps with any of the stars if he does call the collectStar function
    this.physics.add.overlap(player, stars, collectStar, null, this);

    this.physics.add.collider(player, bombs, hitBomb, null, this);

    //Start Timer
    startTime = Date.now();

    timerText = this.add.text(590, 16, 'Time: 0.00', {
        fontSize: '32px',
        fill: '#000'
    });
}

function update ()
{
    if (gameOver)
    {
        return;
    }

    if (cursors.left.isDown)
    {
        player.setVelocityX(-160);

        player.anims.play('left', true);
    }
    else if (cursors.right.isDown)
    {
        player.setVelocityX(160);

        player.anims.play('right', true);
    }
    else
    {
        player.setVelocityX(0);

        player.anims.play('turn');
    }

    if (spaceBar.isDown && player.body.touching.down)
    {
        player.setVelocityY(-330);
    }

    //Update the Timer
    if (!finished)
    {
        elapsedTime = (Date.now() - startTime) / 1000;
        timerText.setText('Time: ' + elapsedTime.toFixed(2));
    }
}


function collectStar (player, star)
{
    star.disableBody(true, true);

    //  Add and update the score
    score += 1;
    scoreText.setText('Score: ' + score);

    //Stop timer when all stars are collected and collect best time
    if (stars.countActive(true) === 0)
    {
        // Respawn all stars
        stars.children.iterate(function (child) {
            child.enableBody(true, child.x, 0, true, true);
        });

        // Spawn a bomb
        var x = (player.x < 400) 
            ? Phaser.Math.Between(400, 800) 
            : Phaser.Math.Between(0, 400);

        var bomb = bombs.create(x, 20, 'bomb');
        bomb.setBounce(1);
        bomb.setCollideWorldBounds(true);
        bomb.setVelocity(Phaser.Math.Between(-200, 200), 20);
        bomb.allowGravity = false;
    }
}

function hitBomb (player, bomb)
{
    this.physics.pause();

    player.setTint(0xff0000);

    player.anims.play('turn');

    gameOver = true;

    finished = true;
}

</script>

</body>
</html>
